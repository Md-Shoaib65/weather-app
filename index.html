<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <form action="#">
            <input id="city-name" type="text" placeholder="Enter your city">
            <input type="submit" value="Get weather">
        </form>
        <div id="weather-data">
            <div class="icon">
                <img src="https://openweathermap.org/img/wn/01d.png" alt="">   // Later, I will fetch data from the OpenWeatherMap API using JavaScript. Based on that data, I will dynamically change the background or weather image to match the current weather conditions.
            </div>
            <div class="temp">30°C</div>
            <div class="desc">haze</div>

            <div class="details">
                <div>Feels like: 30°C</div>
                <div>Humidity: 60%</div>
                <div>Wind Speed: 13 km/h</div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
